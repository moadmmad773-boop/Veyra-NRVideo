# Unofficial test build of Veyra with the on-screen text (capture card / PS5
# subtitles) live translation source, from branch feature/screen-text-translation.
# Publishes the package as the "screen-text-test" pre-release of this fork and
# pushes a readable report to the ci/results branch.
name: M$M! build (Veyra + screen text translation)

on:
  push:
    branches: [ci/test-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veyra-test-build
  cancel-in-progress: true

env:
  SOURCE_REF: custom/mmm
  # 'true': publish the package as the "mmm" pre-release; otherwise build, test and report only.
  PUBLISH: 'false'

  OFFICIAL_TAG: v2.2.0
  DEPS: D:\deps
  BUILD: D:\b
  STAGE: D:\stage
  LOGS: D:\logs

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - name: Source (feature branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: src
      - name: CI scripts
        uses: actions/checkout@v4
        with:
          path: ci
      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: D:\Qt
          cache: true
      - name: Cache official package
        uses: actions/cache@v4
        with:
          path: D:\deps\official
          key: veyra-official-${{ env.OFFICIAL_TAG }}-nvidia
      - name: Dependencies
        id: deps
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force $env:LOGS | Out-Null
          "SOURCE_SHA=$(git -C src rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pwsh -NoProfile -File ci/ci/fetch-deps.ps1 *>&1 | Tee-Object -FilePath "$env:LOGS\1-deps.log"
          exit $LASTEXITCODE
      - name: Build
        id: build
        shell: pwsh
        timeout-minutes: 240
        run: |
          pwsh -NoProfile -File ci/ci/build.ps1 *>&1 | Tee-Object -FilePath "$env:LOGS\2-build.log"
          exit $LASTEXITCODE
      - name: Package
        id: package
        shell: pwsh
        run: |
          pwsh -NoProfile -File ci/ci/package.ps1 *>&1 | Tee-Object -FilePath "$env:LOGS\3-package.log"
          exit $LASTEXITCODE
      - name: Screenshots
        id: shots
        if: steps.package.outcome == 'success'
        shell: pwsh
        timeout-minutes: 15
        run: pwsh -NoProfile -File ci/ci/shots.ps1 *>&1 | Tee-Object -FilePath "$env:LOGS\4-shots.log"
      - name: Publish release
        id: publish
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **M`$M! 2.2.0 (NVIDIA)** - personal build based on Veyra 2.2.0 by Likely7 (GPL-3.0), from branch ``$($env:SOURCE_REF)`` @ ``$($env:SOURCE_SHA)``.

          - **MMM-2.2.0-NVIDIA.zip**: the full program. Unzip into a new folder and run **M`$M!.exe**.
          - **MMM-update.zip**: only the changed files. Unzip over a folder that already has this program (replace files), then run **M`$M!.exe**.

          What changed: translation the way VI Translator does it - its offline OPUS-MT English -> Arabic model (in the package, no internet, about 0.2 s a line) with its handling of speaker names, sound cues and game terms; every line's translation shown. New layout: a page rail on the left, settings sections as chips, icon tabs in Pro mode, new menus, the light "frost" look.

          **التغييرات:** الترجمة بطريقة vi-translator نفسها: نموذج OPUS-MT المحلي (داخل البرنامج، بدون إنترنت، حوالي 0.2 ثانية للجملة) مع معالجته لأسماء المتكلمين والأصوات والمصطلحات، وكل جملة تنعرض ترجمتها · ترتيب جديد للقوائم: شريط صفحات على اليسار، أقسام الإعدادات أزرار فوق، تبويبات بأيقونات في الوضع الاحترافي، قوائم منسدلة جديدة، والشكل الفاتح.

          الملف الكامل: فكّه في مجلد جديد وشغّل M`$M!.exe. ملف التحديث: فكّه فوق المجلد اللي عندك (استبدال الملفات) وشغّل M`$M!.exe.
          "@
          Set-Content "$env:RUNNER_TEMP\notes.md" $notes -Encoding utf8
          foreach ($tag in 'screen-text-test', 'mmm') { gh release delete $tag -R $env:GITHUB_REPOSITORY -y --cleanup-tag 2>$null }
          gh release create mmm $env:PACKAGE $env:UPDATE -R $env:GITHUB_REPOSITORY --prerelease `
            --title "M`$M! 2.2.0 (VI Translator + new layout)" --notes-file "$env:RUNNER_TEMP\notes.md" --target $env:GITHUB_SHA
      - name: Report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          R_DEPS: ${{ steps.deps.outcome }}
          R_BUILD: ${{ steps.build.outcome }}
          R_PACKAGE: ${{ steps.package.outcome }}
          R_PUBLISH: ${{ steps.publish.outcome }}
        run: pwsh -NoProfile -File ci/ci/report.ps1
